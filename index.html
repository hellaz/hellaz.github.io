  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-hover: #182236;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #10b981;
      --glow: rgba(56, 189, 248, 0.15);
    }
    body {
      font-family: 'Open Sans', sans-serif;
      background: radial-gradient(circle at 20% 0%, #0f1d36 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    
    /* Header Navbar */
    header {
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.85);
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 68px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
      text-decoration: none;
    }
    .brand-badge {
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: #090d16;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }

    /* Main Content Layout */
    .hero-layout {
      padding: 48px 0 24px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 32px;
      align-items: center;
    }
    @media (max-width: 900px) { .hero-layout { grid-template-columns: 1fr; } }

    .hero-intro h1 {
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    .hero-intro p { color: var(--muted); font-size: 1.05rem; margin-bottom: 24px; }

    /* Interactive Search Console Card */
    .console-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    .console-card h3 { font-size: 0.88rem; color: var(--muted); margin-top: 0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    .search-box { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-box input {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .search-box input:focus { outline: none; border-color: var(--accent); }
    .btn-search {
      background: var(--accent);
      color: #06101d;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .quick-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-pills a {
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
    }
    .quick-pills a:hover { border-color: var(--accent); color: var(--accent); }

    /* H-E-L-L-A-Z Slideshow Presentation Deck */
    .slideshow {
      margin: 24px 0 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .slideshow input[type="radio"] { display: none; }
    .slide { display: none; }
    
    /* Radio button state handling for pure CSS slide switching */
    #slideCheckbox1:checked ~ .slide:nth-of-type(1),
    #slideCheckbox2:checked ~ .slide:nth-of-type(2),
    #slideCheckbox3:checked ~ .slide:nth-of-type(3),
    #slideCheckbox4:checked ~ .slide:nth-of-type(4),
    #slideCheckbox5:checked ~ .slide:nth-of-type(5),
    #slideCheckbox6:checked ~ .slide:nth-of-type(6),
    #slideCheckbox7:checked ~ .slide:nth-of-type(7) {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .slide__content h1 { color: var(--accent); font-size: 1.8rem; font-weight: 700; margin-bottom: 14px; }
    .slide__content p { color: var(--muted); font-size: 1rem; margin-bottom: 12px; }

    /* Slide Navigation Buttons (H E L L A Z TEAM) */
    .slideshow nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .slide-button {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .slide-button:hover { background: var(--glow); color: var(--text); border-color: var(--accent); }

    /* Active button styling based on checked input */
    #slideCheckbox1:checked ~ nav label[for="slideCheckbox1"],
    #slideCheckbox2:checked ~ nav label[for="slideCheckbox2"],
    #slideCheckbox3:checked ~ nav label[for="slideCheckbox3"],
    #slideCheckbox4:checked ~ nav label[for="slideCheckbox4"],
    #slideCheckbox5:checked ~ nav label[for="slideCheckbox5"],
    #slideCheckbox6:checked ~ nav label[for="slideCheckbox6"],
    #slideCheckbox7:checked ~ nav label[for="slideCheckbox7"] {
      background: var(--accent);
      color: #06101d;
      border-color: var(--accent);
    }

    /* Ecosystem Grid Header & Cards */
    .section-title { font-size: 1.35rem; font-weight: 700; margin: 36px 0 16px; border-top: 1px solid var(--border); padding-top: 24px; }
    .ecosystem-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 48px;
    }
    .eco-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .eco-card:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, 0.4); }
    .eco-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .eco-domain { font-weight: 700; font-size: 1.05rem; color: var(--text); }
    .eco-tag { font-size: 0.7rem; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: rgba(56, 189, 248, 0.1); color: var(--accent); }
